# ======================================================================================
# Cerno SRE Triage Agent — Docker Compose
# ======================================================================================
# Usage:
#   cp .env.example .env
#   docker compose up --build -d
#   docker compose logs -f indexer
#
# Ports:
#   frontend:3000, backend:8000, langfuse:3001, qdrant:6333, postgres:5432, redis:6379
# ======================================================== ==============================

services:
  # ---------------------------------------------------------------------------
  # INTAKE LAYER
  # ---------------------------------------------------------------------------

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    environment:
      - API_URL=http://backend:8000/api/v1
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API & SECURITY LAYER
  # ---------------------------------------------------------------------------

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cerno
      - LANGFUSE_HOST=http://langfuse:3000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # DATA & OBSERVABILITY LAYER
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cerno
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:3
    ports:
      - '3001:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cerno
      - NEXTAUTH_SECRET=${JWT_SECRET:-changeme-langfuse-secret}
      - SALT=${JWT_SECRET:-changeme-langfuse-salt}
      - TELEMETRY_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # INIT CONTAINER — Codebase Indexer (runs once on first boot)
  # ---------------------------------------------------------------------------
  # Embeds the pre-chunked Reaction Commerce codebase (chunks.json) into Qdrant
  # using all-MiniLM-L6-v2 embeddings (384 dimensions).
  # Checks if the collection already has data; skips if Qdrant volume is populated.
  # Subsequent `docker compose up` calls skip this step entirely.

  indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ['python', '-m', 'app.indexer']
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      qdrant:
        condition: service_started
    restart: 'no'

# =============================================================================
# NAMED VOLUMES — Persist data across container restarts
# =============================================================================
# - qdrant_data: Prevents 3-5 min re-embedding cold start (SCALING.md D9)
# - postgres_data: Incidents, users, tickets, Langfuse traces
# - redis_data: Rate limiting state (optional, can be ephemeral)

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
