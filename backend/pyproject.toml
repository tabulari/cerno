[project]
name = "cerno-backend"
version = "0.1.0"
description = "Cerno SRE Incident Intake & Triage Agent — Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "instructor>=1.3",
    "openai>=1.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "llm-guard>=0.3",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "langfuse>=2.40",
    "structlog>=24.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
